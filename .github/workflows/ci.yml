name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  # Releases are built by release.yml with their version; this build is "dev".
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis
      - run: .github/scripts/build.sh dev
      - uses: actions/upload-artifact@v7
        with:
          name: wtfsync-windows-amd64
          path: |
            dist/wtfsync.exe
            dist/wtfsync-tray.exe
            dist/wtfsync-setup.exe
            dist/checksums.txt
      # PRs that change the pages get fresh screenshots to review (docs/screenshots is refreshed by
      # hand with the same script).
      - name: Screenshots of the pages
        id: shots
        if: github.event_name == 'pull_request'
        run: |
          git fetch -q --depth=1 origin "${{ github.base_ref }}"
          if git diff --quiet FETCH_HEAD -- internal/ui/web; then
            echo "pages unchanged"
          else
            .github/scripts/screenshots.sh dist/screenshots
            echo "made=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v7
        if: steps.shots.outputs.made == 'true'
        with:
          name: screenshots
          path: dist/screenshots
