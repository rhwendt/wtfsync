name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: GOOS=windows GOARCH=amd64 go build -o wtfsync.exe ./cmd/wtfsync
      - uses: actions/upload-artifact@v7
        with:
          name: wtfsync-windows-amd64
          path: wtfsync.exe

  # Every merge to main whose commits include a feat, fix, perf or breaking change publishes a
  # GitHub Release with wtfsync.exe, versioned from the Conventional Commits since the last tag.
  release:
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        run: echo "tag=$(.github/scripts/next-version.sh)" >> "$GITHUB_OUTPUT"
      - if: steps.version.outputs.tag != ''
        uses: actions/download-artifact@v8
        with:
          name: wtfsync-windows-amd64
      - if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          .github/scripts/release-notes.py "$TAG" > notes.md
          gh release create "$TAG" wtfsync.exe --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
